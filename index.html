<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BenSocial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: three-column app shell (nav rail · feed column · live rail) that collapses to one column with a bottom tab bar on phones.
   Text colors (--fg, --muted, --faint, --gain, --loss) keep at least 4.5:1 contrast on --bg, --surface and --surface-2 in both themes. */
:root{
  color-scheme: dark;
  --bg:#141019; --surface:#1C1723; --surface-2:#27212F; --line:#352D41;
  --fg:#F3EFF8; --muted:#AAA0B9; --faint:#9289A3;
  --accent:#FFD23F; --accent-ink:#1E1704; --accent-text:#FFD23F; --accent-soft:rgba(255,210,63,.13);
  --love:#FF6B8B; --gain:#3DDC97; --loss:#FF6767; --danger:#FF6767; --danger-ink:#2A0606;
  --paper:#FBF7EC; --paper-ink:#2A251C; --paper-line:#CFC6B2;
  --f1:#8AB4FF; --f2:#5FD3C6; --f3:#FF8A4C; --f4:#FF9AD0; --f5:#B9A0FF; --f6:#FFD23F;
  --shadow:0 18px 44px rgba(0,0,0,.5); --scrim:rgba(8,6,12,.68);
  --font-display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#EEE9F3; --line:#DED6E7;
    --fg:#1C1623; --muted:#625872; --faint:#6F6680;
    --accent:#FFD23F; --accent-ink:#1E1704; --accent-text:#8C6500; --accent-soft:rgba(255,196,0,.22);
    --love:#D92D57; --gain:#08774A; --loss:#D33434; --danger:#C42B2B; --danger-ink:#FFFFFF;
    --paper:#FFFDF5; --paper-ink:#2A251C; --paper-line:#D9D0BC;
    --f1:#2F6FE0; --f2:#0F9488; --f3:#E0601E; --f4:#D23D95; --f5:#7552E0; --f6:#C99A00;
    --shadow:0 16px 36px rgba(48,24,72,.14); --scrim:rgba(30,20,40,.45);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#EEE9F3; --line:#DED6E7;
  --fg:#1C1623; --muted:#625872; --faint:#6F6680;
  --accent:#FFD23F; --accent-ink:#1E1704; --accent-text:#8C6500; --accent-soft:rgba(255,196,0,.22);
  --love:#D92D57; --gain:#08774A; --loss:#D33434; --danger:#C42B2B; --danger-ink:#FFFFFF;
  --paper:#FFFDF5; --paper-ink:#2A251C; --paper-line:#D9D0BC;
  --f1:#2F6FE0; --f2:#0F9488; --f3:#E0601E; --f4:#D23D95; --f5:#7552E0; --f6:#C99A00;
  --shadow:0 16px 36px rgba(48,24,72,.14); --scrim:rgba(30,20,40,.45);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.2 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;font-weight:600}
.skip:focus{left:16px}
.i{flex:none;display:block}

/* Ticker */
.ticker{background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;font:500 12px/1 var(--font-mono);color:var(--muted)}
.ticker-track{display:inline-flex;padding-block:9px;animation:tick 70s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk{padding-inline:0 30px;display:inline-flex;gap:6px;align-items:center}
.tk b{color:var(--fg);font-weight:500}
.tk-live{color:var(--accent-ink);background:var(--accent);padding:3px 6px;border-radius:4px;letter-spacing:.08em}
@keyframes tick{to{transform:translateX(-50%)}}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,620px) 300px;justify-content:center;gap:28px;max-width:1240px;margin:0 auto;padding-inline:16px;align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);max-height:100dvh;overflow-y:auto;padding-block:18px 24px;display:flex;flex-direction:column;gap:18px}
main{min-width:0;padding-block:22px 96px;outline:none}
.live{position:sticky;top:env(safe-area-inset-top,0px);max-height:100dvh;overflow-y:auto;padding-block:22px 24px;display:flex;flex-direction:column;gap:14px}

.logo{font:800 26px/1 var(--font-display);letter-spacing:-.02em;display:inline-flex;align-items:baseline}
.logo mark{background:var(--accent);color:var(--accent-ink);padding:0 .14em .04em;margin-left:.04em;border-radius:.12em .32em .18em .4em;transform:rotate(-2deg);display:inline-block}
.tagline{color:var(--muted);font-size:13px;margin-top:6px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;font-size:15.5px;color:var(--muted);position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current="page"]{color:var(--fg);font-weight:650;background:var(--surface-2)}
.nav-item[aria-current="page"] .i{color:var(--accent-text)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--love);color:#fff;font:600 11px/18px var(--font-mono);text-align:center;margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:15px;line-height:1;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.link{color:var(--accent-text);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--fg);background:var(--surface)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.me-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.me-row{display:flex;align-items:center;gap:10px;min-width:0}
.me-row>div{min-width:0}
.me-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{color:var(--muted);font-size:13px}
.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-pair>div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat-pair b{display:block;font:500 15px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.stat-pair span{font-size:11.5px;color:var(--muted)}
.xp{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.xp>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .5s ease}
.rail-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;font-size:13px}
.rail-foot button{color:var(--muted);text-align:left;padding:4px 12px;display:flex;align-items:center;gap:8px}
.rail-foot button:hover{color:var(--fg)}

/* Topbar + tabbar (phones) */
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:10px}
.topbar .logo{font-size:22px}
.topbar .spacer{flex:1}
.pill-stat{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font:500 13px/1 var(--font-mono)}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .badge{position:absolute;top:2px;right:0;margin:0}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 6px;border-radius:10px;min-width:56px}
.tabbar button[aria-current="page"]{color:var(--fg);font-weight:600}
.tabbar button[aria-current="page"] .i{color:var(--accent-text)}

/* Views */
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.view-title{font-size:30px;font-weight:750;letter-spacing:-.02em}
.view-sub,.lede{color:var(--muted);font-size:14.5px;margin-bottom:16px;max-width:60ch}
.lede{font-size:15.5px}
.lede b{color:var(--fg)}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--gain)} .down{color:var(--loss)}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tab{padding:7px 14px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:650;box-shadow:0 1px 0 var(--line)}

/* Welcome */
.welcome{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:16px;overflow:hidden}
.welcome h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-bottom:12px;padding-right:32px}
.welcome h2 mark{background:var(--accent);color:var(--accent-ink);padding:0 .15em;border-radius:.15em}
.welcome ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.welcome li{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-width:0}
.welcome li .i{color:var(--accent-text);margin-top:2px}
.welcome li b{display:block}
.welcome li span{color:var(--muted)}
.welcome .x{position:absolute;top:12px;right:12px}

/* Composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;margin-bottom:16px}
.composer textarea{width:100%;min-height:64px;resize:vertical;background:transparent;border:0;outline:none;font-size:16.5px;line-height:1.45;padding:10px 0 4px}
.composer textarea::placeholder{color:var(--faint)}
.composer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.composer-row .spacer{flex:1}
.count{font:500 12px var(--font-mono);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

.drop-banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.drop-banner p{flex:1;font-size:14px;min-width:0}

.new-pill-wrap{display:flex;justify-content:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;height:0}
.new-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);transform:translateY(-4px);animation:pop .3s ease}
@keyframes pop{from{transform:translateY(-14px);opacity:0}}

/* Feed + posts */
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px 18px;border-top:1px solid var(--line)}
.feed>:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 50% 44%);color:#fff;font:700 15px/1 var(--font-display);flex:none;letter-spacing:.01em}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.lg{width:72px;height:72px;font-size:26px}
.av.sq{border-radius:10px}
.post-body{min-width:0}
.post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.name{font-weight:650}
.handle{color:var(--muted);font-size:14px}
.pro-tag{font:600 10px/1 var(--font-mono);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:3px 5px;border-radius:4px;align-self:center}
.head-act{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-text);padding:3px 11px;border:1px solid var(--line);border-radius:999px}
.head-act.on{color:var(--muted)}
.head-act:hover{background:var(--surface-2)}
.post-text{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.receipt-link{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font:500 12px/1 var(--font-mono);color:var(--muted);border-bottom:1px dashed var(--faint);padding-bottom:2px}
.receipt-link:hover{color:var(--fg)}
.post-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.clout-chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--font-mono);padding:6px 10px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.clout-chip:hover{outline:1px solid var(--line)}
.clout-chip .lbl{color:var(--muted)}
.tips-line{font-size:12.5px;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:2px;margin-top:8px;max-width:500px;margin-left:-8px}
.act{display:inline-flex;align-items:center;gap:6px;padding:7px 8px;border-radius:999px;color:var(--muted);font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.act:hover{background:var(--surface-2);color:var(--fg)}
.act.love.on{color:var(--love)} .act.love.on .i{fill:currentColor}
.act.hate.on{color:var(--loss)}
.act.rp.on{color:var(--gain)}
.act[aria-expanded="true"]{color:var(--accent-text)}
.act-l{font-family:var(--font-body);font-size:13px}

.pop{margin-top:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pop-row{display:flex;gap:8px;flex-wrap:wrap}
.pop .fine{font-size:12.5px;color:var(--muted)}

.poll{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.poll-opt{text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-weight:550}
.poll-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.poll-row{position:relative;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.poll-row>*{position:relative}
.poll-fill{position:absolute!important;inset:0 auto 0 0;background:var(--line);transition:width .6s ease}
.poll-row.mine .poll-fill{background:var(--accent-soft)}
.poll-row b{font:500 13px var(--font-mono)}
.poll-meta{font-size:12.5px;color:var(--muted)}

.why{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.why-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.why-head .eyebrow{color:var(--accent-text)}
.why-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.why-bar span{display:block;min-width:0}
.tbl-wrap{overflow-x:auto}
.why-table{width:100%;border-collapse:collapse;font:12.5px/1.3 var(--font-mono);font-variant-numeric:tabular-nums}
.why-table th{text-align:left;font-weight:500;font-family:var(--font-body);font-size:13px;padding:4px 0;white-space:nowrap}
.why-table td{text-align:right;padding:4px 0 4px 10px;color:var(--muted);white-space:nowrap}
.why-table td:last-child{color:var(--fg)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}
.why-note{font-size:13px;color:var(--muted)}
.why-actions{display:flex;gap:6px;flex-wrap:wrap}

.thread{margin-top:12px;display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);padding-left:12px}
.reply{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;font-size:14.5px}
.reply p{overflow-wrap:anywhere}
.reply-form,.inline-form{display:flex;gap:8px}
.reply-form input,.field{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}
.reply-form input:focus,.field:focus,.edit-form textarea:focus{border-color:var(--accent)}
.edit-form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.edit-form textarea{width:100%;min-height:80px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;outline:none}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Ads */
.ad{padding:16px 18px;border-top:1px solid var(--line);background:var(--surface-2);display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.ad-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ad-pay{margin-left:auto;font:500 12px/1 var(--font-mono);background:var(--accent);color:var(--accent-ink);padding:5px 9px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.ad-pay.paid{background:transparent;color:var(--gain);border:1px solid var(--gain)}
.ad-copy{margin-top:4px;font-size:15px}
.ad-receipt{margin-top:10px;border-top:1px dashed var(--faint);padding-top:8px;font:12px/1.6 var(--font-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.ad-receipt b{color:var(--fg);font-weight:500}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* Algorithm */
.formula{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:14px;overflow-wrap:anywhere}
.formula .k{color:var(--muted)}
.formula .term{white-space:nowrap}
.formula .sw{margin-right:5px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.dial{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dial-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dial label{font-weight:650;display:flex;align-items:center}
.dial output{font-size:13px;color:var(--muted)}
.dial input{width:100%;accent-color:var(--c,var(--accent));margin:0}
.dial-desc{font-size:13px;color:var(--muted)}
.preview{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:rk}
.preview li{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;gap:10px;align-items:center;counter-increment:rk}
.preview li::before{content:counter(rk);font:500 13px var(--font-mono);color:var(--muted);text-align:center}
.preview .snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.list-row{display:flex;align-items:center;gap:10px;justify-content:space-between}

/* Market */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:500 22px/1.2 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:30px minmax(0,1fr) 96px 84px auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .who{font-size:13px;color:var(--muted)}
.mrow .snip{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .px{text-align:right;font:500 14px/1.3 var(--font-mono);font-variant-numeric:tabular-nums}
.mrow .px small{display:block;font-size:12px}
.spark{display:block;overflow:visible}
.spark.up{color:var(--gain)} .spark.down{color:var(--loss)}
.spark-line{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark-area{fill:currentColor;opacity:.12;stroke:none}
.spark-dot{fill:currentColor}
.note-box{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* Duels */
.duel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.duel-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.duel h2{font-size:22px;font-weight:750;letter-spacing:-.015em}
.sides{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.vs{align-self:center;font:800 14px var(--font-display);color:var(--muted)}
.side{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.side.mine{border-color:var(--accent);background:var(--accent-soft)}
.side-who{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.side p{font-size:15px;flex:1}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;font:500 13px/34px var(--font-mono);font-variant-numeric:tabular-nums}
.split>div{padding:0 10px;white-space:nowrap;transition:flex-basis .6s ease;min-width:0;overflow:hidden}
.split>div{color:var(--fg)}
.split .a{background:color-mix(in srgb,var(--f1) 38%,var(--surface))}
.split .b{background:color-mix(in srgb,var(--f3) 38%,var(--surface));text-align:right}
.locked{display:flex;align-items:center;justify-content:center;gap:8px;height:34px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:13.5px}

/* Wallet */
.balance{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.big-num{font:500 44px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price-out{font:500 28px/1 var(--font-mono)}
#adPrice{width:100%;accent-color:var(--accent);margin:0}
.scale{display:flex;justify-content:space-between;font:12px var(--font-mono);color:var(--faint)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.status{display:inline-block;font:500 11.5px/1 var(--font-mono);padding:4px 8px;border-radius:999px}
.status.ok{color:var(--gain);border:1px solid currentColor}
.status.no{color:var(--muted);border:1px dashed var(--line)}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.book{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.book b{display:block;font-size:14px;margin-bottom:6px}
.book .bar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-bottom:6px}
.book .bar i{display:block}
.book p{font:12.5px/1.4 var(--font-mono);color:var(--muted)}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ledger li:first-child{border-top:0}
.ledger .mono{white-space:nowrap}

/* Activity */
.notes{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.notes li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 16px;border-top:1px solid var(--line);font-size:14.5px}
.notes li:first-child{border-top:0}
.notes .dot{width:8px;height:8px;border-radius:50%;background:transparent}
.notes li.unread .dot{background:var(--accent)}
.notes time{font:12px var(--font-mono);color:var(--muted)}

/* Profile */
.profile-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-card>div{min-width:0;flex:1 1 180px}
.profile-name{font-size:26px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stats>div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.stats b{display:block;font:500 18px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.badge-card .i{color:var(--accent-text)}
.badge-card b{font-size:13.5px}
.badge-card span{font-size:12px;color:var(--muted)}
.badge-card.off{opacity:.5;border-style:dashed}
.badge-card.off .i{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form-grid .field{border-radius:10px}

/* Live rail cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:12px}
.flame{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.streak b{font:750 22px/1 var(--font-display)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days span{display:flex;flex-direction:column;align-items:center;gap:4px;font:11px var(--font-mono);color:var(--faint)}
.days i{width:100%;height:6px;border-radius:999px;background:var(--surface-2)}
.days .on i{background:var(--accent)}
.days .on{color:var(--muted)}
.mini{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:4px;border-radius:10px}
.mini:hover{background:var(--surface-2)}
.mini .snip{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .who{font-size:12px;color:var(--muted)}
.mini .mono{font-size:12px}
.fine{font-size:12px;color:var(--faint)}

/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.modal-card{position:relative;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;z-index:2;background:var(--surface)}
.modal-x:hover{background:var(--surface-2)}
.pro h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.pro .price{font:500 15px var(--font-mono);color:var(--muted);margin:6px 0 16px}
.pro ul{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.pro li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.pro li .i{color:var(--gain);margin-top:3px}

.receipt{background:var(--paper);color:var(--paper-ink);font:13px/1.55 var(--font-mono);padding:22px 20px 30px;margin:8px auto 0;max-width:340px;position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:12px 0}
.r-title{text-align:center;font-weight:500;letter-spacing:.14em}
.r-meta,.r-foot{text-align:center;font-size:11.5px;letter-spacing:.06em}
.r-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.05em}
.r-ver p{margin-top:6px;overflow-wrap:anywhere}
.r-ver.old p{text-decoration:line-through;text-decoration-color:var(--paper-line);opacity:.8}

/* People, menus, safety */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.h3{font:650 15px/1.3 var(--font-body);margin:0}
.name-btn{display:inline;text-align:left;border-radius:6px}
.name-btn:hover .name,.name-btn:hover b,.who .name-btn:hover{text-decoration:underline;text-underline-offset:3px}
.av[data-act]{cursor:pointer}
.head-tools{margin-left:auto;display:inline-flex;align-items:center;gap:4px;align-self:center}
.head-tools .head-act{margin-left:0}
.more{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.more:hover,.more[aria-expanded="true"]{background:var(--surface-2);color:var(--fg)}
.more.sm{width:26px;height:26px}
.menu{position:absolute;z-index:70;min-width:200px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;animation:fade .12s ease}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14.5px;text-align:left;white-space:nowrap}
.menu-item:hover,.menu-item:focus-visible{background:var(--surface-2)}
.menu-item:focus-visible{outline-offset:-2px}
.menu-item .i{color:var(--muted)}
.menu-item.danger,.menu-item.danger .i{color:var(--loss)}
.btn.danger{background:var(--danger);color:var(--danger-ink)}
.confirm{margin-top:10px;border:1px solid var(--loss);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.confirm p{font-size:14px}
.confirm .row{justify-content:flex-start}
.reply-head{display:flex;align-items:flex-start;gap:6px}
.reply-who{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
button.side-who{text-align:left;border-radius:10px;padding:2px 4px 2px 0}
button.side-who:hover b{text-decoration:underline;text-underline-offset:3px}
.back-btn{margin-bottom:12px}
.bio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.follow-counts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.follow-counts b{color:var(--fg);font:500 15px var(--font-mono);font-variant-numeric:tabular-nums}
.person-tools{display:flex;align-items:center;gap:6px}
.person-card>div:first-of-type{flex:1 1 180px}
.person-card>.person-tools{flex:none}
.blocked-note{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.settings-sub{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sheet h2{font-size:24px;font-weight:750;letter-spacing:-.015em;padding-right:36px}
.sheet{display:flex;flex-direction:column;gap:14px}
.sheet .row{justify-content:flex-end}
.reasons{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.reason{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;cursor:pointer}
.reason:hover{background:var(--surface-2)}
.reason:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.reason input{margin:0;accent-color:var(--accent-text);width:16px;height:16px;flex:none}
.reason:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sheet textarea.field,.form-grid textarea.field{border-radius:10px;resize:vertical;min-height:72px;line-height:1.45}
.field-label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.rules li::marker{font:500 13px var(--font-mono);color:var(--muted)}
.rules b{color:var(--fg)}

/* Long single-word names wrap instead of pushing the page wider than the screen. */
.profile-name>span,.post-head .name-btn,.reply-who .name-btn,.side-who span,.person-row-text .name-btn,.notes li>span,.mod-meta>span,.toast>span{min-width:0;overflow-wrap:anywhere}
.post-head .name-btn{max-width:100%}
.profile-card>.person-tools{flex:none;flex-wrap:wrap}

/* Live mode: finding people, follower lists */
.search-form{margin-bottom:16px}
.search-form .field{width:100%;border-radius:12px;padding:11px 14px;font-size:16px}
.people-list{display:flex;flex-direction:column}
.person-row{padding:10px 0;border-top:1px solid var(--line)}
.person-row:first-child{border-top:0}
.person-row>.me-row{flex:1}
.person-row-text{display:flex;flex-direction:column;min-width:0}
.person-row-text .muted{overflow-wrap:anywhere}
.count-btn{color:inherit;border-radius:6px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.count-btn:hover{text-decoration-color:currentColor}
.count-btn b{color:var(--fg);font:500 15px var(--font-mono);font-variant-numeric:tabular-nums}

/* Live mode: sign-in and status screens, moderation */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
body[data-gate] .skip,body[data-gate] .ticker,body[data-gate] .topbar,body[data-gate] .shell,body[data-gate] .tabbar{display:none!important}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.gate-card .logo{font-size:32px}
.gate-card .tab{flex:1}
.gate-card.center{align-items:center;text-align:center}
.gate-card.center .row{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack label:not(.check){display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.stack .field{border-radius:10px;padding:10px 12px}
.stack .link{align-self:flex-start;font-size:13.5px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer}
.check input{margin:2px 0 0;width:17px;height:17px;accent-color:var(--accent-text);flex:none}
.form-msg{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.form-msg.err{color:var(--loss);border-color:var(--loss);background:transparent}
.form-msg.ok{border-color:var(--gain)}
.handle-status{font-size:12.5px;color:var(--muted)}
.stack .hint,.stack .handle-status{margin-top:-6px}
.stack .handle-status:empty{margin-top:-12px} /* Stays in the page for screen readers, takes no room while empty. */
.handle-status.ok{color:var(--gain)}
.handle-status.bad{color:var(--loss)}
.btn.ghost.danger-text{color:var(--loss)}
.status.bad{color:var(--loss);border:1px solid currentColor}
.removed-note{margin-top:6px;font-size:12.5px;color:var(--loss)}
.account-row>span{min-width:0;overflow-wrap:anywhere}
.account-row .btn{flex:none}
.mod-item{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mod-item:first-of-type{border-top:0;padding-top:0}
.mod-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.mod-content{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14.5px}
.mod-actions{display:flex;gap:6px;flex-wrap:wrap}
.switch-row{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel-head+p+.switch-row{border-top:0;padding-top:0}
.switch-head{display:flex;align-items:center;gap:10px}
.switch-name{font-size:16px;font-weight:650}
.switch-row>.row{justify-content:flex-start}
.duel-side{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.duel-side legend{font-weight:650;font-size:13.5px;padding:0 4px;color:var(--fg)}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;animation:pop .25s ease;max-width:100%}
.toast.accent{background:var(--accent);color:var(--accent-ink)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .3s ease}
.toast-act{font-weight:700;text-decoration:underline;white-space:nowrap}
.burst{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:95;animation:burst .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.flash{animation:flash 1s ease}
@keyframes flash{0%{background:var(--accent-soft)}}

.only-narrow{display:none}

@media (max-width:1180px){
  .shell{grid-template-columns:220px minmax(0,620px)}
  .live{display:none}
  .only-narrow{display:flex}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .topbar,.tabbar{display:flex}
  main{padding-block:16px 110px}
  .new-pill-wrap{top:calc(env(safe-area-inset-top,0px) + 70px)}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .badges{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .view-title{font-size:25px}
  .post,.ad{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:14px}
  .post>.av,.ad>.av,.composer>.av{width:36px;height:36px;font-size:13px}
  .composer{grid-template-columns:36px minmax(0,1fr);padding:12px 14px}
  .act-l{display:none}
  .welcome ul,.dials,.books,.form-grid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child{grid-column:1/-1}
  .mrow{grid-template-columns:30px minmax(0,1fr) auto;row-gap:8px}
  .mrow .spark-cell{display:none}
  .mrow .btn{grid-column:2/-1;justify-self:start}
  .sides{grid-template-columns:minmax(0,1fr)}
  .vs{justify-self:center}
  .big-num{font-size:36px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .ticker{overflow-x:auto}
  .ticker-track{animation:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="ticker" aria-label="Live activity"><div class="ticker-track" id="ticker"></div></div>
<header class="topbar" id="topbar"></header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main id="view" tabindex="-1"></main>
  <aside class="live" id="live" aria-label="Live"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Dialog">
    <button class="modal-x" data-act="close" aria-label="Close"></button>
    <div id="modalBody"></div>
  </div>
</div>

function mkPost(p, now) {

  for (let i = 0; i < HIST; i++) { v = Math.max(1, v * (1 + mom * 0.12 + rand(-0.02, 0.02))); hist.push(+v.toFixed(2)); }

    id: p.id, by: p.by, text: p.text, at: now - (p.mins || 0) * 6e4,
    likes: p.likes || 0, dislikes: p.dislikes || 0, replies: p.replies || 0, reposts: p.reposts || 0,
    tips: p.tips || 0, tippers: p.tippers || 0, spicy: p.spicy ?? .3, wholesome: p.wholesome ?? .4, mom,
    price: hist[hist.length - 1], hist,
    edits: (p.edits || []).map(e => ({ text: e.text, at: now - e.mins * 6e4 })),
    editedAt: p.editedMins != null ? now - p.editedMins * 6e4 : null,
    poll: p.poll ? { opts: p.poll.map(o => ({ ...o })), mine: null } : null,
    thread: (p.thread || []).map((r, i) => ({ id: p.id + '-r' + i, by: r.by, text: r.text, at: now - r.mins * 6e4 })),

}

// Seed posts tagged `needs` follow the switches in a saved demo too: a switch turned off takes its post out,
// and turned on brings it in. `seeded` remembers which seed posts were added, so one that scrolled out stays out.
function syncSeedPosts(s) {
  if (!Array.isArray(s.seeded)) s.seeded = SEED_POSTS.filter(p => s.posts.some(x => x.id === p.id)).map(p => p.id);
  const off = new Set(SEED_POSTS.filter(p => !switchedOn(p)).map(p => p.id));
  s.posts = s.posts.filter(p => !off.has(p.id));
  s.seeded = s.seeded.filter(id => !off.has(id));
  const now = Date.now();
  for (const p of SEED_POSTS) {
    if (!switchedOn(p) || s.seeded.includes(p.id)) continue;
    s.posts.push(mkPost(p, now)); s.seeded.push(p.id);

function levelInfo(xp) { let lv = 1, need = 100, base = 0; while (xp >= base + need) { base += need; lv++; need = 100 + (lv - 1) * 50; } return { lv, into: xp - base, need }; }

function factors(p) {
  const ageH = (Date.now() - p.at) / 36e5;
  const tot = p.likes + p.dislikes;
  const contro = tot ? 2 * Math.min(p.likes, p.dislikes) / tot : 0;
  const fol = isFollowing(p.by);
  return {
    recency: Math.exp(-ageH / 8),
    friends: fol ? 1 : 0,
    spicy: clamp(0.55 * p.spicy + 0.45 * contro, 0, 1),
    wholesome: p.wholesome,
    discovery: fol ? 0 : 1,
    popular: clamp(Math.log10(1 + p.likes + 2 * p.reposts + p.replies) / 4.2, 0, 1),
  };
}
function score(p) {
  const f = factors(p); const parts = {}; let s = 0;
  for (const F of FACTORS) { parts[F.k] = f[F.k] * S.dial[F.k] / 100; s += parts[F.k]; }
  return { s, f, parts };
}
function ranked() {
  const fresh = p => isMe(p.by) && Date.now() - p.at < 10 * 6e4;
  return S.posts.filter(p => !hiddenBy(p.by))
    .map(p => [p, score(p).s + (fresh(p) ? 100 : 0)])
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function feedPosts() {
  const list = S.posts.filter(p => !hiddenBy(p.by));
  if (S.tab === 'following') return list.filter(p => isFollowing(p.by)).sort((a, b) => b.at - a.at);
  if (S.tab === 'latest') return list.sort((a, b) => b.at - a.at);

}

// What a position would sell for right now. Live mode follows the server's bonding curve: selling h shares
// pays h × price − 0.025 × h² (sell_position in supabase/schema.sql), so a fresh position is worth what it cost.
const holdValue = (h, p) => LIVE ? Math.max(0, h.shares * p.price - 0.025 * h.shares * h.shares) : h.shares * p.price;
function portfolio() {
  let value = 0, cost = 0;
  for (const [id, h] of Object.entries(S.holdings)) { const p = postById(id); if (!p) continue; value += holdValue(h, p); cost += h.cost; }
  return { value, cost, pl: value - cost };
}

/* ---------- progression ---------- */
function gainXP(n) {
  if (LIVE) return; // The server awards XP in live mode.
  const before = levelInfo(S.me.xp).lv;
  S.me.xp += n;
  const after = levelInfo(S.me.xp).lv;
  if (after > before) {
    const bonus = 50 * after;
    S.me.clout += bonus;
    toast(`Level ${after} reached. +${bonus} clout.`, { tone: 'accent' });
    note(`You reached level ${after}.`);
    burst($('[data-me="lv"]') || document.body);
  }
}

/* ---------- data: every write goes through one function here ----------
   Demo mode changes local state (demoApi). Live mode calls the backend (liveApi, further down)
   through the same method names; the actions only decide what to show. */
function toggleReact(p, kind) {
  if (p.react === kind) { p.react = null; p[kind === 'like' ? 'likes' : 'dislikes']--; return false; }
  if (p.react) p[p.react === 'like' ? 'likes' : 'dislikes']--;
  p.react = kind; p[kind === 'like' ? 'likes' : 'dislikes']++;
  return true;
}
const demoApi = {
  createPost(text, mood) {
    const p = mkPost({ id: 'm' + Date.now().toString(36), by: 'me', mins: 0, text,
      spicy: mood === 'spicy' ? .8 : mood === 'wholesome' ? .05 : .25,
      wholesome: mood === 'wholesome' ? .85 : mood === 'spicy' ? .1 : .35, mom: .045 }, Date.now());
    p.price = 5; p.hist = Array(HIST).fill(5);
    S.posts.unshift(p); S.stats.posts++;
    gainXP(25);
    return p;
  },
  editPost(id, text) {
    const p = postById(id);
    if (!p || !text || text === p.text) return false;
    p.edits.push({ text: p.text, at: p.editedAt || p.at });
    p.text = text; p.editedAt = Date.now();
    return true;
  },
  deletePost(id) {
    const p = postById(id); if (!p || !isMe(p.by)) return null;
    const h = S.holdings[id], refund = h ? h.cost : 0;
    if (h) { S.me.clout += refund; delete S.holdings[id]; }
    S.posts = S.posts.filter(x => x.id !== id);
    return { refund };
  },
  react(id, kind) {
    const p = postById(id); if (!p) return;
    if (toggleReact(p, kind) && kind === 'like') { gainXP(2); p.mom += 0.002; }
  },
  repost(id) {
    const p = postById(id); p.reposted = !p.reposted; p.reposts += p.reposted ? 1 : -1;
    if (p.reposted) gainXP(3);
    return p.reposted;
  },
  reply(id, text) {
    const p = postById(id), r = { id: 'r' + Date.now().toString(36), by: 'me', text, at: Date.now() };
    p.thread.push(r); p.replies++; gainXP(8);
    return r;
  },
  deleteReply(postId, replyId) {
    const p = postById(postId); if (!p) return;
    const before = p.thread.length;
    p.thread = p.thread.filter(r => r.id !== replyId);
    if (p.thread.length < before) p.replies = Math.max(0, p.replies - 1);
  },
  follow(by) {
    const i = S.follows.indexOf(by);
    if (i >= 0) { S.follows.splice(i, 1); return false; }
    if (isBlocked(by)) return false;
    S.follows.push(by); gainXP(3);
    return true;
  },
  mute(by, on) { S.muted = S.muted.filter(x => x !== by); if (on) S.muted.push(by); },
  block(by, on) {
    S.blocked = S.blocked.filter(x => x !== by);
    if (!on) return;
    S.blocked.push(by);
    S.follows = S.follows.filter(x => x !== by);
    if (S.fans.includes(by)) { S.fans = S.fans.filter(x => x !== by); S.me.followers = Math.max(0, S.me.followers - 1); }
  },
  report(target, reason, details) {
    S.reports.unshift({ t: Date.now(), ...target, reason, details });
    S.reports = S.reports.slice(0, 100);
  },
  back(id, amt) {
    const p = postById(id), shares = amt / p.price;
    const h = S.holdings[id] || (S.holdings[id] = { shares: 0, cost: 0 });
    h.shares += shares; h.cost += amt; S.me.clout -= amt; p.mom += 0.004;
    S.stats.backs++; gainXP(10);
    return { shares, price: p.price };
  },
  sell(id) {
    const p = postById(id), h = S.holdings[id]; if (!p || !h) return null;
    const proceeds = h.shares * p.price, profit = proceeds - h.cost;
    S.me.clout += proceeds; delete S.holdings[id];
    if (profit > 0) gainXP(Math.min(40, Math.round(profit / 5)));
    return { proceeds, profit };
  },
  vote(id, side) {
    const d = S.duels.find(x => x.id === id); if (!d || d.vote) return null;
    d.vote = side; d[side].v++; S.stats.votes++; gainXP(5);
    return { lead: d[side].v >= d[side === 'a' ? 'b' : 'a'].v };
  },
  claimDrop() {
    const doubled = isPro(), amount = randi(40, 160) * (doubled ? 2 : 1);
    S.me.clout += amount; S.me.dropDay = dayKey(); gainXP(20);
    return { amount, doubled };
  },
  saveProfile({ name, handle, bio }) { S.me.name = name; S.me.handle = handle; S.me.bio = bio; },

  // Held monetization. Only reachable while its switch is on.
  tip(id, amt) {
    const p = postById(id);
    S.me.cash -= amt; p.tips += amt * (1 - TIP_FEE); p.tippers++; p.mom += 0.01;
    ledger(`Tip to @${author(p).handle}`, -amt, 'pay');
    S.stats.tips++; gainXP(15);
  },
  addFunds(c) { S.me.cash += c; ledger('Added funds (demo)', c, 'pay'); },
  creditAd(a) {
    const pay = a.bid * AD_SHARE;
    S.me.cash += pay; S.me.earned += pay;
    ledger(`Ad view · ${a.brand}`, pay, 'ad');
    return pay;
  },
};

    return optimistic(q, () => { demoApi.mute(by, was); render(); }, on ? null : reloadFeedQuiet); // Unmuting brings their posts back.
  },
  async block(by, on) {
    const was = { blocked: [...S.blocked], follows: [...S.follows] }, u = PEOPLE.get(by), followed = S.follows.includes(by);
    demoApi.block(by, on);
    try { await call(on ? sb.from('blocks').insert({ blocked: by }) : sb.from('blocks').delete().eq('blocker', MY_ID).eq('blocked', by)); }
    catch (e) { if (!(e && e.code === '23505')) { S.blocked = was.blocked; S.follows = was.follows; throw e; } }
    if (on && followed && u) u.followers_count = Math.max(0, u.followers_count - 1);
    refreshMe();
    if (!on) reloadFeedQuiet();
  },
  async report(target, reason, details) {
    const row = { reason, details };
    for (const [k, v] of Object.entries(target)) row[k] = k === 'profile_id' ? v : Number(v);
    await call(sb.from('reports').insert(row), { slow_down: "You've sent a lot of reports today. Try again tomorrow." });
  },
  async back(id, amt) {
    const p = postById(id);
    const r = await rpc('back_post', { p_post: Number(id), p_amount: amt }, { not_found: "That post isn't available anymore." });
    const shares = num(r.shares), spent = num(r.spent, amt);
    const h = S.holdings[id] || (S.holdings[id] = { shares: 0, cost: 0 });
    h.shares += shares; h.cost += spent; S.me.clout = num(r.clout, S.me.clout);
    if (p) setPrice(p, num(r.price, NaN));
    S.stats.backs++; refreshMe();
    return { shares, price: shares ? spent / shares : p ? p.price : 0 };
  },
  async sell(id) {
    if (!S.holdings[id]) return null;
    const r = await rpc('sell_position', { p_post: Number(id) }, { not_found: "You don't hold any shares in that post." });
    delete S.holdings[id]; S.me.clout = num(r.clout, S.me.clout);
    refreshMe(); refreshPost(id).catch(e => console.warn(e));
    return { proceeds: num(r.proceeds), profit: num(r.profit) };
  },
  async vote(id, side) {
    const d = S.duels.find(x => x.id === id); if (!d || d.vote) return null;
    try {
      const r = await rpc('vote_duel', { p_duel: Number(id), p_side: side });
      d.a.v = num(r.a_votes, d.a.v); d.b.v = num(r.b_votes, d.b.v); d.vote = r.side === 'a' || r.side === 'b' ? r.side : side;
    } catch (e) {
      if (e && (e.message === 'already_voted' || e.message === 'duel_closed')) loadDuels().then(() => { if (S.view === 'duels') render(); }, () => {});
      throw e;
    }
    S.stats.votes++; refreshMe();
    return { lead: d[d.vote].v >= d[d.vote === 'a' ? 'b' : 'a'].v };
  },
  async claimDrop() {
    const today = dayKey(), before = levelInfo(S.me.xp).lv;
    let r;
    try { r = await rpc('claim_daily_drop', { p_today: today }); }
    catch (e) { if (e && e.message === 'already_claimed') { S.me.dropDay = today; render(); } throw e; }
    S.me.clout = num(r.clout, S.me.clout); S.me.xp = num(r.xp, S.me.xp); S.me.dropDay = today;
    levelUp(before); refreshMe();
    return { amount: num(r.amount), doubled: !!r.doubled && PAY_ON }; // The server doubles it only while payments are on there too.
  },
  async saveProfile({ name, handle, bio }) {
    await call(sb.from('profiles').update({ name, handle, bio }).eq('id', MY_ID), { unique: ERRORS.handle_taken, check: 'Names are 1 to 40 characters and bios up to 160.' });
    S.me.name = name; S.me.handle = handle; S.me.bio = bio;
  },
  // Held monetization. No payment processor is connected, so live actions stop at a toast before reaching these.
  tip() { throw new Error('payments_off'); },
  addFunds() { throw new Error('payments_off'); },
  async creditAd(a) {
    const r = await rpc('record_ad_view', { p_ad: Number(a.id), p_today: dayKey() });
    const pay = num(r.earned_cents);
    S.me.earned = S.me.cash = num(r.earnings_cents, S.me.earned);
    if (pay > 0) ledger(`Ad view · ${a.brand}`, pay, 'ad'); else UI.adZero.add(a.id);
    return pay;
  },
};

function spark(vals, w = 96, h = 28) {
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 3 - (v - min) / r * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const up = vals[vals.length - 1] >= vals[0];
  return `<svg class="spark ${up ? 'up' : 'down'}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path class="spark-area" d="${d} L${w} ${h} L0 ${h} Z"/><path class="spark-line" d="${d}"/><circle class="spark-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6"/></svg>`;
}
const chgSpan = p => { const c = chg(p); return `<span class="${c >= 0 ? 'up' : 'down'}" data-b="chg:${p.id}">${pct(c)}</span>`; };

const moreBtn = (key, label, cls = '') => `<button class="more ${cls}" data-act="menu" data-id="${esc(key)}" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="${esc(label)}">${ic('more', cls ? 16 : 18)}</button>`;

const confirming = (kind, id) => UI.confirm && UI.confirm.kind === kind && UI.confirm.id === id;

}

}
function peopleResultsHTML() {
  const P = UI.people || { q: '', ids: null, loading: true }, q = P.q;
  const head = `<h2 class="h2">${q ? 'People' : 'Newest members'}</h2>`;
  if (P.error) return `${head}<p class="note-box">Couldn't search right now. ${esc(P.error)}</p>`;
  if (!P.ids) return `${head}<p class="muted small" role="status">Searching…</p>`;
  if (!P.ids.length) return `${head}<p class="muted small">${q ? `Nobody matches “${esc(q)}”.` : 'Nobody else is here yet. Share your profile link from your Profile to invite people.'}</p>`;
  return head + `<div class="people-list">${P.ids.map(id => personRowHTML(id)).join('')}</div>`;
}
let peopleTimer = null, peopleSeq = 0;
async function searchPeople(q) {
  const seq = ++peopleSeq;
  UI.people = { q, ids: UI.people && UI.people.q === q ? UI.people.ids : null };
  renderPeople();
  try {
    const rows = await rpc('search_people', { p_query: q, p_limit: 30 }) || [];
    if (seq !== peopleSeq) return; // A newer search is on its way.
    rows.forEach(addPerson);
    UI.people = { q, ids: rows.map(r => r.id).filter(id => !isMe(id)) };
  } catch (e) {
    if (seq !== peopleSeq) return;
    console.warn(e); UI.people = { q, ids: [], error: errMsg(e) };
  }
  renderPeople();
}
function renderPeople() {
  const el = $('#peopleResults');
  if (el && S.view === 'people') keepFocus(el, () => { el.innerHTML = peopleResultsHTML(); });
}
// Followers and following, in a dialog. Live mode reads them from the follows table.
async function showFollowList(id, which) {
  const title = which === 'followers' ? 'Followers' : 'Following';
  openModal(`<div class="sheet"><div><span class="eyebrow">@${esc(person(id).handle)}</span><h2>${title}</h2></div><div id="followListBody"><p class="muted small" role="status">Loading…</p></div></div>`, title);
  let html;
  try {
    const mine = which === 'followers' ? 'followee' : 'follower', theirs = which === 'followers' ? 'follower' : 'followee';
    const rows = await call(sb.from('follows').select(theirs).eq(mine, id).order('created_at', { ascending: false }).limit(200)) || [];
    const ids = rows.map(r => r[theirs]);
    await loadPeople(ids);
    const shown = ids.filter(x => isMe(x) || (PEOPLE.has(x) && !PEOPLE.get(x).banned && !isBlocked(x)));
    html = shown.length ? `<div class="people-list">${shown.map(x => personRowHTML(x, false)).join('')}</div>` : '<p class="muted small">Nobody yet.</p>';
  } catch (e) { console.warn(e); html = `<p class="note-box">Couldn't load the list. ${esc(errMsg(e))}</p>`; }
  const body = $('#followListBody'); if (body) body.innerHTML = html;
}

function modItemHTML(r) {
  const reason = (REPORT_REASONS.find(x => x[0] === r.reason) || [null, 'Other'])[1];
  const kind = { post: 'Post', reply: 'Reply', profile: 'Profile' }[r.target_kind] || 'Deleted content';
  const who = r.target_handle == null ? '' : ` by ${r.target_user ? nameBtn(r.target_user, '@' + esc(r.target_handle)) : '@' + esc(r.target_handle)}`;
  const btn = (act, id, arg, label, danger) => `<button class="btn ${danger ? 'danger' : 'ghost'} sm" data-act="${act}" data-id="${esc(id)}" data-arg="${arg}">${label}</button>`;
  const h = esc(r.target_handle || ''), gone = r.target_kind === 'gone';
  return `<article class="mod-item" data-report="${esc(r.report_id)}">

/* ---------- ads seen = money earned ---------- */
let adObserver = null;
function observeAds() {
  if (!ADS_ON || !('IntersectionObserver' in window)) return;
  if (adObserver) adObserver.disconnect();
  adObserver = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const id = e.target.dataset.ad;
      if (UI.seenAds.has(id)) continue;
      const a = adList().find(x => x.id === id);
      if (!a || a.bid < S.adPrice) continue;
      // The 30s poll saw ads turned off on the server since this page loaded. Drop them quietly, as below.
      if (LIVE && !adsServed()) { S.ads = []; renderFeed(); console.warn('ads are off on the server'); return; }
      UI.seenAds.add(id);

document.addEventListener('keydown', e => {
  const menu = $('#menu');
  if (UI.menu && menu.contains(document.activeElement)) {
    const items = $$('.menu-item', menu), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); return; }
    if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1].focus(); return; }
    if (e.key === 'Tab') { closeMenu(true); return; } // Focus returns to the toggle, then Tab moves on from there.
  }
  if (e.key === 'Tab' && !$('#modal').hidden) {
    const card = $('#modal .modal-card');
    const f = $$('button, input, textarea, select, a[href]', card).filter(x => !x.disabled && x.getClientRects().length);
    const first = f[0], last = f[f.length - 1];
    if (!card.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) closeModal();
    else if (UI.menu) closeMenu(true);
    else if (UI.confirm) ACTIONS.cancelDelete();
    else if (UI.confirmAccount) ACTIONS.cancelDeleteAccount();
    else if (UI.switchAsk) ACTIONS.cancelSwitch();

    f.reset();

/* ---------- simulation: the world keeps moving ---------- */
let ticks = 0;
const pickUser = () => { const ids = Object.keys(USERS).filter(id => !isBlocked(id)); return ids.length ? pick(ids) : null; };
function tick() {
  ticks++;
  for (const p of S.posts) {
    p.mom = clamp(p.mom * 0.99 + rand(-0.003, 0.003) + (Math.random() < 0.015 ? 0.03 : 0), -0.03, 0.06);
    p.price = Math.max(1, +(p.price * (1 + p.mom * 0.3 + rand(-0.012, 0.012))).toFixed(2));
    p.hist.push(p.price); if (p.hist.length > HIST) p.hist.shift();
    const heat = Math.max(0, p.mom) * 60 + 0.4;
    if (Math.random() < 0.55) {
      const add = randi(0, Math.ceil(heat * (1 + p.likes / 2000)));
      p.likes += add;
      const fan = p.by === 'me' && add > 0 && Math.random() < 0.35 && pickUser();
      if (fan) {
        const u = USERS[fan];
        note(`<b>@${esc(u.handle)}</b> liked your post “${esc(short(p.text, 40))}”`);
        if (Math.random() < 0.4) toast(`@${esc(u.handle)} liked your post`);
      }
    }
    if (Math.random() < p.spicy * 0.5) p.dislikes += randi(0, Math.ceil(heat * p.spicy * (1 + p.dislikes / 2000)));
    if (Math.random() < 0.12) p.replies++;
    if (Math.random() < 0.07) p.reposts++;
  }
  for (const d of S.duels) {
    if (d.endsAt <= Date.now()) { if (!d.settled) settle(d); continue; }
    d.a.v += randi(0, 4); d.b.v += randi(0, 4);
  }
  if (ticks % 6 === 0) simEvent();
  if (ticks % 60 === 0) { refreshDuels(); if (S.view === 'duels') render(); }
  if (ticks % 13 === 0 && UI.incoming.length < 5) {
    const src = INCOMING[S.incomingIx++ % INCOMING.length];
    if (!isBlocked(src.by)) {
      const p = mkPost({ ...src, id: 'n' + Date.now().toString(36), mins: 0, likes: randi(2, 40), dislikes: randi(0, Math.round(src.spicy * 20)), mom: .03 }, Date.now());
      UI.incoming.unshift(p); renderPill();
    }
  }
  patch();
  if (ticks % 2 === 0) renderLive();
  if (ticks % 5 === 0) renderTicker();
  save();
}
function simEvent() {
  const mine = S.posts.filter(p => p.by === 'me');
  const held = Object.keys(S.holdings).map(postById).filter(Boolean);
  const votedDuel = S.duels.find(d => d.vote && d.endsAt > Date.now());
  const uid = pickUser(), u = uid && USERS[uid];
  const options = [];
  if (u) options.push(() => { S.me.followers++; if (!S.fans.includes(uid)) S.fans.push(uid); return `<b>@${esc(u.handle)}</b> started following you`; });
  if (u && mine.length) options.push(() => { const p = pick(mine); const amt = pick([25, 50, 100]); p.mom += 0.006; return `<b>@${esc(u.handle)}</b> backed your post with ${amt} clout`; });

function patch() {

    if (error) return formMsg('err', authErr(error));

function loadClient() {

    if (s.src === SUPABASE_CDN || s.src === SUPABASE_CDN_2) { s.integrity = SUPABASE_SRI; s.crossOrigin = 'anonymous'; }
    let settled = false;
    const done = ok => {

      else if (i + 1 < sources.length) attempt(i + 1);

    const timer = setTimeout(() => done(false), 15000);

  if (RECOVERY && session) showRecovery();
  else if (session) bootLive(session);
  else if (phase === 'load') showAuth(LINK_ERROR ? 'That link expired or was already used. Enter your email to get a new one: send the confirmation email again, or choose Forgot password.' : '', 'signin', 'err', '', false, LINK_ERROR);
}
function onAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') { if (phase !== 'recovery') showRecovery(); return; }
  if (event === 'SIGNED_OUT') {
    if (phase !== 'auth') { const wasIn = phase === 'app'; leaveApp(); showAuth(AUTH_NOTE || (wasIn ? 'You were signed out. Sign in again.' : ''), 'signin', AUTH_NOTE ? 'ok' : 'err'); }
    return;
  }
  if (event === 'SIGNED_IN' && session && !RECOVERY && phase === 'auth') bootLive(session);
}
async function bootLive(session) {
  if (!session || phase === 'boot' || phase === 'app') return;
  if (RECOVERY) { showRecovery(); return; }
  phase = 'boot'; SESSION = session;
  MY_ID = session.user.id; EMAIL = session.user.email || '';
  showGate(statusHTML('Loading your feed…'));
  let ok;
  try { ok = await loadEverything(); }
  catch (e) {
    console.error(e);
    if (phase !== 'boot') return;
    phase = 'error';
    showGate(statusHTML("Couldn't load your feed", esc(errMsg(e)), '<button class="btn sm" data-act="retryBoot">Try again</button><button class="btn ghost sm" data-act="signOut">Sign out</button>'), '[data-act="retryBoot"]');
    return;
  }
  if (phase !== 'boot') return; // Signed out while loading.
  if (RECOVERY) showRecovery();
  else if (!ok) showFinish();
  else if (!reloadForSwitches()) enterApp(); // A reload keeps "Loading your feed…" up until the page comes back.
}
// Everything the app needs after sign-in, in parallel. touch_streak() runs first so the profile includes today.
async function loadEverything() {
  const streak = rpc('touch_streak', { p_today: dayKey() }).catch(e => { console.warn('touch_streak failed', e); return null; });
  // The switches decide whether this page may stay as it is (bootLive), and whether ads load at all.
  const switches = rpc('app_switches').then(readSw, e => { console.warn('app_switches failed', e); return null; })
    .then(sw => { SERVER_SW = sw; return sw; });
  const ifAds = q => switches.then(() => adsServed() ? call(q()) : []);
  const [st, prof, follows, mutes, blocks, , positions, , unreadN, stats, ads, views] = await Promise.all([
    streak,
    streak.then(() => rpc('my_profile')), // Other people's profiles show only public columns; your own comes from here.
    call(sb.from('follows').select('followee').eq('follower', MY_ID)),
    call(sb.from('mutes').select('muted_id').eq('user_id', MY_ID)),
    call(sb.from('blocks').select('blocked').eq('blocker', MY_ID)),
    loadFeed(),
    call(sb.from('positions').select('post_id, shares, cost').eq('user_id', MY_ID)),
    loadDuels(),
    // These two need the profile row, which touch_streak() rebuilds if it is missing (not_found otherwise).
    streak.then(() => rpc('unread_count')),
    streak.then(() => rpc('my_stats')),
    ifAds(() => sb.from('ads').select('id, brand, hue, bid_cents, copy, why').eq('active', true)),
    ifAds(() => sb.from('ad_views').select('ad_id, day, earned_cents').eq('user_id', MY_ID).order('day', { ascending: false }).limit(50)),
  ]);
  if (!prof) return false;
  applyProfile(prof, true);
  if (st) { S.me.streak = num(st.streak, S.me.streak); if (Array.isArray(st.active_days)) S.me.days = st.active_days.map(String); S.me.lastDay = st.last_active || S.me.lastDay; }
  S.follows = (follows || []).map(r => r.followee);
  S.muted = (mutes || []).map(r => r.muted_id);
  S.blocked = (blocks || []).map(r => r.blocked);
  S.holdings = {};
  for (const r of positions || []) if (num(r.shares) > 0) S.holdings[String(r.post_id)] = { shares: num(r.shares), cost: num(r.cost) };
  UNREAD = num(unreadN);
  Object.assign(S.stats, statsOf(stats));
  S.ads = (ads || []).map(a => ({ id: String(a.id), brand: String(a.brand || ''), hue: num(a.hue, 200), bid: num(a.bid_cents), copy: String(a.copy || ''), why: String(a.why || '') }));
  const brand = id => (S.ads.find(a => a.id === String(id)) || {}).brand;
  S.ledger = (views || []).filter(v => num(v.earned_cents) > 0)
    .map(v => ({ t: Date.parse(v.day) || Date.now(), label: brand(v.ad_id) ? `Ad view · ${brand(v.ad_id)}` : 'Ad view', c: num(v.earned_cents), k: 'ad' }));
  await Promise.all([
    loadPeople([...S.muted, ...S.blocked]),
    loadExtraPosts(Object.keys(S.holdings).filter(id => !POSTS.has(id))).catch(e => console.warn('held posts failed to load', e)),
  ]);
  return true;
}
function enterApp() {
  phase = 'app';
  hideGate();
  UI.quiet = true; checkBadges(); UI.quiet = false; // Badges you already have don't pop up again.
  const start = route((location.hash || '').slice(1));
  if (start && start.handle) S.view = 'feed'; // Opens once the handle is looked up, below.
  else if (start) { if (start.id) UI.person = start.id; S.view = start.v; }
  if (!canView(S.view)) S.view = 'feed';
  if (S.view === 'activity') UI.notesLoading = true;
  try { history.replaceState(null, '', '#' + hashFor(S.view)); } catch (e) { /* sandboxed */ }
  buildShell(); render(true); renderTicker(); renderChrome(); save(); // Focus moves into the app, off the sign-in form that just went away.
  if (WANT_HANDLE && S.me.handle && S.me.handle !== WANT_HANDLE) toast(`@${esc(WANT_HANDLE)} was taken, so your handle is @${esc(S.me.handle)}. You can change it in Profile.`);
  WANT_HANDLE = '';
  let notice = ''; // Left by the Switchboard just before it reloaded this page.
  try { notice = sessionStorage.getItem(NOTICE_KEY) || ''; sessionStorage.removeItem(NOTICE_KEY); } catch (e) { /* none */ }
  if (notice) toast(esc(notice), { tone: 'accent' });
  if (S.view !== 'duels') enterView(S.view);
  if (start && start.handle) openHandle(start.handle);
  clearInterval(liveTimer); liveTimer = setInterval(liveTick, POLL_MS); lastPoll = Date.now();
}
function leaveApp() {
  clearInterval(liveTimer); liveTimer = null;
  [meTimer, dialTimer, priceTimer, handleTimer].forEach(clearTimeout);
  if (adObserver) adObserver.disconnect();
  closeMenu(); closeModal();
  PEOPLE.clear(); POSTS.clear(); MY_ID = ''; EMAIL = ''; UNREAD = 0; SESSION = null;
  S = blankLive();
  Object.assign(UI, { why: new Set(), open: new Set(), pop: null, editing: null, mood: null, incoming: [], seenAds: new Set(), adZero: new Set(), rank: new Map(),
    editProfile: false, confirm: null, person: null, from: null, reportDraft: null, personState: null, personPosts: null, mod: null, handleCheck: null, confirmAccount: false, people: null,
    switchAsk: null });
  WANT_HANDLE = ''; clearTimeout(peopleTimer);
  for (const sel of ['#rail', '#topbar', '#tabbar', '#view', '#live', '#ticker']) $(sel).innerHTML = '';
}
async function signOut(note) {
  AUTH_NOTE = note;
  S.draft = ''; clearTimeout(saveTimer); writeStore();
  try { const { error } = await sb.auth.signOut(); if (error) throw error; }
  catch (e) { console.warn(e); try { await sb.auth.signOut({ scope: 'local' }); } catch (e2) { /* the local session is gone either way */ } }
  if (phase !== 'auth') { leaveApp(); showAuth(note, 'signin', 'ok'); }
  setTimeout(() => { AUTH_NOTE = ''; }, 0);
}
// Every 30s while the tab is visible: unread count, whether the feed has newer posts, and the monetization switches.
function liveTick() {
  if (phase !== 'app' || document.visibilityState !== 'visible') return;
  patch(); renderLive(); renderTicker(); // Prices change with your own trades too.
  poll();
  if (S.me.lastDay && S.me.lastDay !== dayKey()) touchToday(); // The app stayed open past midnight.
}
async function touchToday() {
  try {
    const st = await rpc('touch_streak', { p_today: dayKey() });
    if (phase !== 'app' || !st) return;
    S.me.streak = num(st.streak, S.me.streak); S.me.lastDay = st.last_active || dayKey();
    if (Array.isArray(st.active_days)) S.me.days = st.active_days.map(String);
    renderLive(); commit();
  } catch (e) { console.warn('touch_streak failed', e); S.me.lastDay = dayKey(); }
}
async function poll() {
  lastPoll = Date.now();
  try {
    const [n, rows, sw] = await Promise.all([rpc('unread_count'), rpc('feed', { p_limit: 50 }),
      rpc('app_switches').then(readSw, e => { console.warn('app_switches failed', e); return null; })]);
    if (phase !== 'app') return;
    if (sw) noteSwitches(sw); // A change applies the next time this browser opens BenSocial.
    UNREAD = num(n);
    const have = new Set(S.posts.map(p => p.id)), newest = S.posts.reduce((m, p) => Math.max(m, p.at), 0);
    UI.incoming = (rows || []).filter(r => !have.has(String(r.id)) && !isMe(r.author_id) && Date.parse(r.created_at) > newest);
    renderPill(); renderChrome();
    if (S.duels.some(d => !d.settled && d.endsAt <= Date.now())) {
      await loadDuels();
      if (S.view === 'duels') render();
      renderTicker(); refreshMe(0);
    }
  } catch (e) { console.warn('poll failed', e); }
}
function liveStart() {
  if (S.theme) document.documentElement.dataset.theme = S.theme;
  $('.modal-x').innerHTML = ic('x');
  const problem = backendProblem();
  if (problem) { phase = 'error'; showGate(statusHTML("BenSocial isn't set up correctly", esc(problem))); console.error('BenSocial setup: ' + problem); return; }
  document.addEventListener('visibilitychange', () => {
    if (phase === 'app' && document.visibilityState === 'visible' && Date.now() - lastPoll >= POLL_MS) { patch(); poll(); }
  });
  loadClient();
}

addEventListener('hashchange', () => {
  if (phase !== 'app') return;
  const r = route(location.hash.slice(1)); if (!r) return;
  if (r.handle) openHandle(r.handle);
  else if (r.v === 'person') { if (r.id !== UI.person || S.view !== 'person') openPerson(r.id); }
  else if (r.v !== S.view || !canView(r.v)) go(r.v);
});
matchMedia('(max-width:1180px)').addEventListener('change', renderLive);
if (LIVE) liveStart(); else demoStart();
})();
</script>
